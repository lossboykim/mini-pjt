<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>런북 대응 어시스턴트</title>
<style>
  :root {
    --bg: #f4f6fa; --panel: #ffffff; --text: #111827; --muted: #6b7280; --line: #e2e6ee;
    --brand: #1428a0; --brand-dark: #0c1a6e; --accent-text: #ffffff;
    --user: #1428a0; --user-text: #ffffff;
    --ok: #0f8a5f; --warn: #c26a00; --bad: #d1242f; --code: #f1f3f8;
    --header: #ffffff; --header-text: #111827;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0f24; --panel: #121a36; --text: #e8ecf6; --muted: #9aa4bf; --line: #24305a;
      --brand: #5b7cff; --brand-dark: #3d5ef0; --accent-text: #ffffff;
      --user: #2a43c9; --user-text: #ffffff;
      --ok: #3fcf95; --warn: #f2a541; --bad: #ff6b72; --code: #1a2346;
      --header: #0d1430; --header-text: #e8ecf6;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.65 "Pretendard", system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; letter-spacing: -0.01em; }

  /* 상단: 흰 바탕, 위쪽 브랜드 블루 띠, 굵은 워드마크 */
  header { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 28px; background: var(--header); color: var(--header-text);
           border-top: 4px solid var(--brand); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark { font-weight: 800; font-size: 19px; letter-spacing: -0.02em; color: var(--brand); }
  .brand h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .spacer { flex: 1; }
  header .thread { color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace; }

  button { font: inherit; cursor: pointer; border-radius: 2px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 7px 14px; font-weight: 500; transition: background .15s, border-color .15s, color .15s; }
  button:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--brand); color: var(--accent-text); border-color: var(--brand); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--brand-dark); border-color: var(--brand-dark); color: var(--accent-text); }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button.danger:hover:not(:disabled) { background: var(--bad); color: #fff; border-color: var(--bad); }
  button.ghost { border-color: var(--brand); color: var(--brand); }

  .layout { display: grid; grid-template-columns: 1fr 340px; height: calc(100% - 64px); }
  main { display: flex; flex-direction: column; min-height: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 880px; width: 100%; }
  .msg.user { align-self: flex-end; max-width: 620px; width: auto; background: var(--user); color: var(--user-text); padding: 11px 16px; border-radius: 2px; white-space: pre-wrap; }
  .msg.bot { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--brand); border-radius: 2px; padding: 18px 22px; box-shadow: 0 1px 2px rgba(17, 24, 39, .04); }
  .msg.bot.error { border-color: var(--bad); border-left-color: var(--bad); color: var(--bad); }
  .answer h1, .answer h2, .answer h3 { font-size: 15.5px; font-weight: 700; margin: 16px 0 6px; }
  .answer h3:first-child { margin-top: 0; }
  .answer p { margin: 6px 0; }
  .answer ul, .answer ol { margin: 6px 0; padding-left: 22px; }
  .answer li::marker { color: var(--brand); }
  .answer strong { font-weight: 700; }
  .answer hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  code { background: var(--code); padding: 1px 6px; border-radius: 2px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  pre { background: var(--code); padding: 12px; border-radius: 2px; overflow-x: auto; font-size: 12.5px; margin: 6px 0; }
  pre code { background: none; padding: 0; }

  .badge { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 10px; border-radius: 2px; letter-spacing: .02em; }
  .badge.completed { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .badge.awaiting_approval { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .meta { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
  details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; color: var(--brand); font-size: 13px; font-weight: 600; }
  .ctx { margin: 10px 0; }
  .ctx .id { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--brand); font-weight: 600; }
  .ctx pre { white-space: pre-wrap; max-height: 220px; }
  .step { display: flex; gap: 10px; font-size: 13px; padding: 2px 0; }
  .step .n { color: var(--muted); width: 22px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
  .step details { margin: 0; border: 0; padding: 0; flex: 1; }
  .step summary { color: var(--text); font-weight: 500; font-family: ui-monospace, Consolas, monospace; }

  .approval { margin-top: 14px; padding: 14px 16px; background: color-mix(in srgb, var(--warn) 7%, var(--panel)); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); border-radius: 2px; }
  .approval .title { font-weight: 700; color: var(--warn); margin-bottom: 6px; }
  .approval .actions { display: flex; gap: 8px; margin-top: 12px; }
  .loading { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 10px; }
  .loading::before { content: ""; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .welcome { max-width: 680px; padding: 8px 0 4px; }
  .welcome .eyebrow { color: var(--brand); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .welcome h2 { color: var(--text); font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3; margin: 8px 0 12px; }
  .welcome p { color: var(--muted); margin: 0; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 32px 12px; }
  .examples button { font-size: 13px; border-radius: 2px; color: var(--muted); background: var(--panel); }
  form { display: flex; gap: 10px; padding: 14px 32px 18px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 2px; padding: 11px 14px; height: 66px; }
  textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
  form button.primary { min-width: 96px; }
  .hint { padding: 0 32px 6px; color: var(--warn); font-size: 13px; font-weight: 600; }

  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 22px; }
  aside h3 { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--text); margin: 0 0 4px; padding-bottom: 10px; border-bottom: 2px solid var(--text);
             display: flex; align-items: center; justify-content: space-between; }
  aside h3 button { font-size: 11.5px; padding: 3px 9px; letter-spacing: 0; text-transform: none; }
  aside section + section { margin-top: 30px; }
  .svc { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .svc .row { display: flex; justify-content: space-between; align-items: center; }
  .svc .name { font-weight: 700; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .svc .detail { color: var(--muted); font-size: 12px; }
  .st { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; }
  .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st.healthy { color: var(--ok); } .st.degraded { color: var(--warn); } .st.unhealthy { color: var(--bad); }
  .log { font-size: 12.5px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .log .when { color: var(--muted); font-size: 11.5px; }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }

  @media (max-width: 860px) {
    header { padding: 0 16px; }
    .brand h1 { display: none; }
    .layout { grid-template-columns: 1fr; height: auto; }
    main { height: calc(100vh - 64px); }
    aside { border-left: 0; border-top: 1px solid var(--line); padding: 20px 16px; }
    #messages, form, .examples, .hint { padding-left: 16px; padding-right: 16px; }
    .welcome h2 { font-size: 24px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark">Runbook AI</span><h1>런북 대응 어시스턴트</h1></div>
  <span class="spacer"></span>
  <span class="thread" id="threadLabel">새 대화</span>
  <button class="ghost" id="newChat" type="button">새 대화</button>
</header>
<div class="layout">
  <main>
    <div id="messages">
      <div class="welcome" id="welcome">
        <div class="eyebrow">Incident Response</div>
        <h2>장애 증상을 알려 주시면<br>대응 절차를 안내합니다</h2>
        <p>런북·장애 이력·서비스 상태를 근거로 답합니다. 재시작 같은 조치는 이 화면에서 승인해야만 실행됩니다(모든 데이터와 조치는 가짜입니다).</p>
      </div>
    </div>
    <div class="examples" id="examples"></div>
    <div class="hint" id="hint"></div>
    <form id="form">
      <textarea id="question" placeholder="예: payment-api 에러율이 갑자기 올랐어 (Enter 전송, Shift+Enter 줄바꿈)" required></textarea>
      <button class="primary" id="send" type="submit">보내기</button>
    </form>
  </main>
  <aside>
    <section>
      <h3>Service Status <button type="button" id="refreshSvc">새로고침</button></h3>
      <div id="services"><div class="empty">불러오는 중…</div></div>
    </section>
    <section>
      <h3>Action Log <button type="button" id="refreshLog">새로고침</button></h3>
      <div id="actions"><div class="empty">불러오는 중…</div></div>
    </section>
  </aside>
</div>
<script>
const EXAMPLES = [
  "payment-api가 CrashLoopBackOff야",
  "order-worker가 OOM으로 계속 죽어. 런북대로 재시작해줘",
  "api-gateway에서 502가 간헐적으로 나",
  "지금 전체 서비스 상태 알려줘",
];
const STATUS_LABEL = { completed: "완료", awaiting_approval: "승인 대기" };
const $ = (id) => document.getElementById(id);
let threadId = null;
let busy = false;
let waitingApproval = false;

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// 답변용 간단 마크다운: 먼저 HTML을 이스케이프한 뒤 제목·목록·굵게·코드·구분선만 바꾼다.
function inline(s) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(src) {
  const lines = esc(src).split(/\r?\n/);
  let html = "", list = null, code = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const line of lines) {
    if (code !== null) {
      if (/^```/.test(line)) { html += `<pre><code>${code}</code></pre>`; code = null; }
      else code += line + "\n";
      continue;
    }
    if (/^```/.test(line)) { close(); code = ""; continue; }
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { close(); html += `<h3>${inline(m[2])}</h3>`; }
    else if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { close(); html += "<hr>"; }
    else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
    else if (!line.trim()) { close(); }
    else { close(); html += `<p>${inline(line)}</p>`; }
  }
  if (code !== null) html += `<pre><code>${code}</code></pre>`;
  close();
  return html;
}

function scrollDown() { const m = $("messages"); m.scrollTop = m.scrollHeight; }
function addEl(cls, html) {
  $("welcome")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.innerHTML = html;
  $("messages").appendChild(el);
  scrollDown();
  return el;
}

function setThread(id) {
  threadId = id;
  $("threadLabel").textContent = id ? "thread " + id.slice(0, 8) : "새 대화";
  $("threadLabel").title = id || "";
}

function setBusy(b) {
  busy = b;
  $("send").disabled = b || waitingApproval;
  $("question").disabled = b || waitingApproval;
  document.querySelectorAll(".examples button").forEach((x) => (x.disabled = b || waitingApproval));
  $("hint").textContent = waitingApproval ? "승인 대기 중인 조치가 있습니다. 위의 승인 또는 거절을 먼저 선택하세요." : "";
}

function pendingActions(trace) {
  // 마지막 응답 단계 이후의 승인 대기 단계만 모은다.
  const waits = [];
  for (const t of trace || []) if (t.step === "approval_wait") waits.push(t.input || {});
  return waits;
}

function renderResponse(r) {
  let html = `<div class="meta"><span class="badge ${esc(r.status)}">${esc(STATUS_LABEL[r.status] || r.status)}</span></div>`;
  html += `<div class="answer">${md(r.answer || "")}</div>`;

  if (r.status === "awaiting_approval") {
    const acts = pendingActions(r.trace);
    const items = acts.length
      ? acts.map((a) => `<li><code>${esc(a.tool)}</code> — 대상 서비스 <strong>${esc((a.args || {}).service ?? "?")}</strong></li>`).join("")
      : "<li>승인이 필요한 조치</li>";
    html += `<div class="approval"><div class="title">사람 승인이 필요한 조치</div><ul>${items}</ul>
      승인 전에는 아무것도 실행하지 않았습니다.
      <div class="actions"><button class="primary" data-decision="approve">승인하고 실행</button><button class="danger" data-decision="reject">거절</button></div></div>`;
  }

  const ctx = r.contexts || [];
  html += `<details><summary>근거 ${ctx.length}건</summary>` +
    (ctx.length ? ctx.map((c) => `<div class="ctx"><div class="id">${esc(c.doc_id)}</div><pre>${esc(c.text)}</pre></div>`).join("")
                : `<div class="empty">인용한 근거가 없습니다.</div>`) + `</details>`;

  const trace = r.trace || [];
  html += `<details><summary>처리 과정 ${trace.length}단계</summary>` +
    trace.map((t, i) => `<div class="step"><span class="n">${i + 1}</span><details><summary>${esc(t.step)}</summary>
      <pre>${esc(JSON.stringify({ input: t.input, output: t.output }, null, 2))}</pre></details></div>`).join("") + `</details>`;

  const el = addEl("bot", html);
  el.querySelectorAll(".approval button").forEach((b) =>
    b.addEventListener("click", () => decide(b.dataset.decision, el)));
  waitingApproval = r.status === "awaiting_approval";
  setBusy(false);
}

async function call(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `요청 실패 (HTTP ${res.status})`);
  return data;
}

function startLoading(label) {
  const el = addEl("bot", `<div class="loading">${esc(label)} <span>0</span>초</div>`);
  const t0 = Date.now();
  const timer = setInterval(() => { el.querySelector("span").textContent = Math.round((Date.now() - t0) / 1000); }, 1000);
  return () => { clearInterval(timer); el.remove(); };
}

async function ask(question) {
  if (busy || waitingApproval || !question.trim()) return;
  addEl("user", esc(question));
  $("question").value = "";
  setBusy(true);
  const stop = startLoading("에이전트가 런북·이력·상태를 확인하는 중…");
  try {
    const r = await call("/query", threadId ? { question, thread_id: threadId } : { question });
    stop();
    setThread(r.thread_id);
    renderResponse(r);
  } catch (e) {
    stop();
    addEl("bot error", "오류: " + esc(e.message));
    setBusy(false);
  }
}

async function decide(decision, card) {
  card.querySelectorAll(".approval button").forEach((b) => (b.disabled = true));
  setBusy(true);
  const stop = startLoading(decision === "approve" ? "승인한 조치를 실행하는 중…" : "거절을 반영하는 중…");
  try {
    const r = await call("/approve", { thread_id: threadId, decision });
    stop();
    card.querySelector(".approval .title").textContent = decision === "approve" ? "승인함" : "거절함";
    renderResponse(r);
    loadActions(); loadServices();
  } catch (e) {
    stop();
    addEl("bot error", "오류: " + esc(e.message));
    card.querySelectorAll(".approval button").forEach((b) => (b.disabled = false));
    setBusy(false);
  }
}

async function loadServices() {
  try {
    const data = await (await fetch("/services")).json();
    const names = Object.keys(data);
    $("services").innerHTML = names.length ? names.map((n) => {
      const s = data[n];
      return `<div class="svc"><div class="row"><span class="name">${esc(n)}</span><span class="st ${esc(s.status)}">${esc(s.status)}</span></div>
        <div class="detail">파드 ${esc(s.pods_ready)} · 재시작 ${esc(s.restarts_last_hour)}회/시간 · 에러율 ${esc(s.error_rate_pct)}% · p95 ${esc(s.p95_latency_ms)}ms</div>
        ${s.note ? `<div class="detail">${esc(s.note)}</div>` : ""}</div>`;
    }).join("") : `<div class="empty">서비스가 없습니다.</div>`;
  } catch { $("services").innerHTML = `<div class="empty">상태를 불러오지 못했습니다.</div>`; }
}

async function loadActions() {
  try {
    const { actions } = await (await fetch("/actions")).json();
    $("actions").innerHTML = actions.length ? actions.slice().reverse().map((a) =>
      `<div class="log"><code>${esc(a.action)}</code> → <strong>${esc(a.target)}</strong><div class="when">${esc(a.executed_at || "")}</div></div>`).join("")
      : `<div class="empty">아직 실행한 조치가 없습니다.</div>`;
  } catch { $("actions").innerHTML = `<div class="empty">기록을 불러오지 못했습니다.</div>`; }
}

EXAMPLES.forEach((q) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = q;
  b.addEventListener("click", () => ask(q));
  $("examples").appendChild(b);
});
$("form").addEventListener("submit", (e) => { e.preventDefault(); ask($("question").value); });
$("question").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask($("question").value); }
});
$("newChat").addEventListener("click", () => {
  if (busy) return;
  setThread(null); waitingApproval = false;
  $("messages").innerHTML = "";
  setBusy(false);
  $("question").focus();
});
$("refreshSvc").addEventListener("click", loadServices);
$("refreshLog").addEventListener("click", loadActions);
loadServices(); loadActions();
</script>
</body>
</html>
