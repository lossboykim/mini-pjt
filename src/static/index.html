    --bg: #fff3fa; --panel: #ffffff; --text: #4a2a63; --muted: #8f73a8; --line: #f5cfe6;
    --brand: #ff5fa8; --brand-dark: #e8408f; --accent-text: #ffffff;
    --user: #b78cff; --user-text: #ffffff;
    --ok: #1fb89a; --warn: #f29a1f; --bad: #ee4d7a; --code: #f6ecff;
    --header: #ffe3f3; --header-text: #5b2f86;
    --mint: #bff2e4; --lilac: #e6d6ff; --sky: #cfeaff; --sun: #ffe89a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #231638; --panel: #2f1f4d; --text: #f6e9ff; --muted: #c2a8df; --line: #4a3377;
      --brand: #ff7fbd; --brand-dark: #ff5fa8; --accent-text: #3a1450;
      --user: #8a63e0; --user-text: #ffffff;
      --ok: #5fe0c0; --warn: #ffc15e; --bad: #ff7a9e; --code: #3a2760;
      --header: #3a2260; --header-text: #ffe3f3;
      --mint: #2c5f58; --lilac: #4a3377; --sky: #2b4a6e; --sun: #6e5a22;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.65 "Jua", "Pretendard", system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; letter-spacing: -0.01em; }

  /* 상단: 흰 바탕, 위쪽 브랜드 블루 띠, 굵은 워드마크 */
  header { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 28px; background: var(--header); color: var(--header-text);
           border-top: 4px solid var(--brand); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark { font-weight: 800; font-size: 19px; letter-spacing: -0.02em; color: var(--brand); }
  .brand h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .spacer { flex: 1; }
  header .thread { color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace; }

  button { font: inherit; cursor: pointer; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 7px 14px; font-weight: 500; transition: background .15s, border-color .15s, color .15s; }
  button:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--brand); color: var(--accent-text); border-color: var(--brand); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--brand-dark); border-color: var(--brand-dark); color: var(--accent-text); }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button.danger:hover:not(:disabled) { background: var(--bad); color: #fff; border-color: var(--bad); }
  button.ghost { border-color: var(--brand); color: var(--brand); }

  .layout { display: grid; grid-template-columns: 1fr 340px; height: calc(100% - 64px); }
  main { display: flex; flex-direction: column; min-height: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 880px; width: 100%; }
  .msg.user { align-self: flex-end; max-width: 620px; width: auto; background: var(--user); color: var(--user-text); padding: 11px 16px; border-radius: 16px; white-space: pre-wrap; }
  .msg.bot { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--brand); border-radius: 16px; padding: 18px 22px; box-shadow: 0 1px 2px rgba(17, 24, 39, .04); }
  .msg.bot.error { border-color: var(--bad); border-left-color: var(--bad); color: var(--bad); }
  .answer h1, .answer h2, .answer h3 { font-size: 15.5px; font-weight: 700; margin: 16px 0 6px; }
  .answer h3:first-child { margin-top: 0; }
  .answer p { margin: 6px 0; }
  .answer ul, .answer ol { margin: 6px 0; padding-left: 22px; }
  .answer li::marker { color: var(--brand); }
  .answer strong { font-weight: 700; }
  .answer hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  code { background: var(--code); padding: 1px 6px; border-radius: 16px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  pre { background: var(--code); padding: 12px; border-radius: 16px; overflow-x: auto; font-size: 12.5px; margin: 6px 0; }
  pre code { background: none; padding: 0; }

  .badge { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 10px; border-radius: 16px; letter-spacing: .02em; }
  .badge.completed { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .badge.awaiting_approval { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .meta { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
  details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; color: var(--brand); font-size: 13px; font-weight: 600; }
  .ctx { margin: 10px 0; }
  .ctx .id { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--brand); font-weight: 600; }
  .ctx pre { white-space: pre-wrap; max-height: 220px; }
  .step { display: flex; gap: 10px; font-size: 13px; padding: 2px 0; }
  .step .n { color: var(--muted); width: 22px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
  .step details { margin: 0; border: 0; padding: 0; flex: 1; }
  .step summary { color: var(--text); font-weight: 500; font-family: ui-monospace, Consolas, monospace; }

  .approval { margin-top: 14px; padding: 14px 16px; background: color-mix(in srgb, var(--warn) 7%, var(--panel)); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); border-radius: 16px; }
  .approval .title { font-weight: 700; color: var(--warn); margin-bottom: 6px; }
  .approval .actions { display: flex; gap: 8px; margin-top: 12px; }
  .loading { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 10px; }
  .loading::before { content: ""; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .welcome { max-width: none; padding: 8px 0 4px; }
  .welcome .eyebrow { color: var(--brand); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .welcome h2 { color: var(--text); font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3; margin: 8px 0 12px; }
  .welcome p { color: var(--muted); margin: 0; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 32px 12px; }
  .examples button { font-size: 13px; border-radius: 16px; color: var(--muted); background: var(--panel); }
  #form { display: flex; gap: 10px; padding: 14px 32px 18px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 11px 14px; height: 66px; }
  textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
  #form button.primary { min-width: 96px; }
  .hint { padding: 0 32px 6px; color: var(--warn); font-size: 13px; font-weight: 600; }

  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 22px; }
  aside h3 { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--text); margin: 0 0 4px; padding-bottom: 10px; border-bottom: 2px solid var(--text);
             display: flex; align-items: center; justify-content: space-between; }
  aside h3 button { font-size: 11.5px; padding: 3px 9px; letter-spacing: 0; text-transform: none; }
  aside section + section { margin-top: 30px; }
  .svc { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .svc .row { display: flex; justify-content: space-between; align-items: center; }
  .svc .name { font-weight: 700; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .svc .detail { color: var(--muted); font-size: 12px; }
  .st { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; }
  .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st.healthy { color: var(--ok); } .st.degraded { color: var(--warn); } .st.unhealthy { color: var(--bad); }
  .log { font-size: 12.5px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .log .when { color: var(--muted); font-size: 11.5px; }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }

  /* ---- 조사 진행(실시간 단계), 근거 칩, 승인 확인, 이력·모델 표시 ---- */
  .badge.no_evidence, .badge.blocked { color: var(--bad); background: color-mix(in srgb, var(--bad) 11%, transparent); }
  .meta .path { font-size: 12px; color: var(--muted); }
  .meta .path b { color: var(--text); font-weight: 600; }
  .meta .sep { flex: 1; }
  .progress { background: var(--panel); border: 1px dashed color-mix(in srgb, var(--brand) 45%, var(--line)); border-radius: 16px; padding: 14px 18px; max-width: 880px; }
  .progress .head { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 13.5px; }
  .progress .head .timer { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; margin-left: auto; }
  .progress ol { list-style: none; margin: 10px 0 0; padding: 0; }
  .progress li { display: flex; gap: 10px; align-items: baseline; font-size: 13px; padding: 3px 0; color: var(--muted); }
  .progress li::before { content: "✓"; color: var(--ok); font-weight: 700; width: 14px; flex: none; }
  .progress li.now { color: var(--text); font-weight: 600; }
  .progress li.now::before { content: ""; width: 10px; height: 10px; margin: 0 2px; border: 2px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; align-self: center; }
  .progress li.alert::before { content: "!"; color: var(--warn); }
  .progress li .sub { color: var(--muted); font-weight: 400; font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-weight: 500; }
  .chip .k { font-weight: 700; margin-right: 4px; }
  .chip.runbook .k { color: var(--brand); } .chip.incident .k { color: var(--warn); } .chip.status .k { color: var(--ok); } .chip.action .k { color: var(--bad); }
  .ctx.flash { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--brand) 16%, transparent); } to { background: transparent; } }
  pre { position: relative; }
  pre .copy { position: absolute; top: 6px; right: 6px; font-size: 11px; padding: 2px 8px; opacity: .85; }
  .approval .target { margin: 8px 0 0; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; }
  .approval .warnline { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .approval button.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
  .summary { display: flex; gap: 12px; font-size: 12px; color: var(--muted); padding: 10px 0 2px; }
  .summary b { font-weight: 700; }
  .svc { cursor: pointer; } .svc:hover .name { color: var(--brand); }
  .svc.unhealthy { box-shadow: inset 3px 0 0 var(--bad); padding-left: 10px; } .svc.degraded { box-shadow: inset 3px 0 0 var(--warn); padding-left: 10px; }
  .tag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 0 6px; margin-left: 6px; border-radius: 16px; color: var(--brand); background: color-mix(in srgb, var(--brand) 12%, transparent); }
  .inc { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .inc summary { color: var(--text); font-weight: 500; font-size: 12.5px; list-style: none; cursor: pointer; }
  .inc summary::-webkit-details-marker { display: none; }
  .inc .sev { font-size: 10.5px; font-weight: 800; text-transform: uppercase; margin-right: 6px; }
  .inc .sev.critical, .inc .sev.high { color: var(--bad); } .inc .sev.medium { color: var(--warn); } .inc .sev.low { color: var(--muted); }
  .inc .body { color: var(--muted); margin-top: 6px; font-size: 12px; }
  .inc .body button { margin-top: 6px; font-size: 11.5px; padding: 3px 9px; }
  .inc details { margin: 0; border: 0; padding: 0; }
  .model { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .model.switched { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }

  /* ---- 영향 요약(Dynatrace·Datadog Impacts), 조사 결과 분류(Grafana Sift), 최근 변경(Datadog Change Tracking),
          답변 평가(Rootly·Datadog·AWS), 타임라인·보고서(Datadog·CloudWatch·FireHydrant), 확인(Opsgenie) ---- */
  .impact { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 10px 32px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 12.5px; color: var(--muted); }
  .impact b { color: var(--text); font-weight: 700; }
  .impact .lead { font-weight: 800; color: var(--text); letter-spacing: .04em; font-size: 11.5px; text-transform: uppercase; }
  .impact .svcs { display: flex; flex-wrap: wrap; gap: 6px; }
  .impact .svcs button { font-size: 12px; padding: 2px 9px; font-family: ui-monospace, Consolas, monospace; border-radius: 999px; }
  .impact .svcs button.unhealthy { border-color: color-mix(in srgb, var(--bad) 55%, transparent); color: var(--bad); }
  .impact .svcs button.degraded { border-color: color-mix(in srgb, var(--warn) 55%, transparent); color: var(--warn); }
  .impact .svcs button.acked { opacity: .6; }
  .impact .clock { margin-left: auto; font-variant-numeric: tabular-nums; }
  .oc { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 0 6px; border-radius: 16px; margin-left: 6px; }
  .oc.found { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .oc.clear { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .oc.failed { color: var(--bad); background: color-mix(in srgb, var(--bad) 11%, transparent); }
  .findings .grp { margin: 8px 0 0; font-size: 12.5px; }
  .findings .grp .h { font-weight: 700; font-size: 12px; margin-bottom: 2px; }
  .findings .grp ul { margin: 0; padding-left: 18px; color: var(--muted); }
  .changed { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .changed button { font-size: 12px; padding: 2px 10px; border-radius: 999px; color: var(--brand); border-color: color-mix(in srgb, var(--brand) 40%, var(--line)); }
  .fb { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .fb button { font-size: 12px; padding: 3px 10px; }
  .fb textarea { flex-basis: 100%; height: 60px; font-size: 13px; }
  .fb .done { color: var(--ok); font-weight: 600; }
  .tabs { display: flex; gap: 0; margin: -22px -22px 22px; border-bottom: 1px solid var(--line); position: sticky; top: -22px; background: var(--panel); z-index: 1; }
  .tabs button { flex: 1; border: 0; border-bottom: 2px solid transparent; padding: 12px 8px; font-size: 13px; font-weight: 700; color: var(--muted); background: none; border-radius: 0; }
  .tabs button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
  .tabs .count { font-size: 11px; color: var(--muted); font-weight: 600; margin-left: 4px; }
  .ack { font-size: 11px; padding: 1px 8px; margin-left: 8px; }
  .svc .row .right { display: inline-flex; align-items: center; white-space: nowrap; flex: none; }
  .svc .row { gap: 8px; }
  .svc .nm { white-space: nowrap; }
  .svc.acked { opacity: .72; }
  .acked-tag { font-size: 10.5px; color: var(--muted); margin-left: 6px; font-weight: 600; }
  .chg { display: flex; gap: 10px; align-items: baseline; font-size: 12.5px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .chg .k { font-size: 10.5px; font-weight: 800; width: 44px; flex: none; }
  .chg .k.deploy { color: var(--brand); } .chg .k.action { color: var(--bad); }
  .chg .what { flex: 1; } .chg .when { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .note-form { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 14px; }
  .note-form textarea { height: 64px; font-size: 13px; }
  .note-form .row, .tl-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tl-tools { margin-bottom: 6px; font-size: 12px; color: var(--muted); }
  .tl-tools .spacer { flex: 1; }
  .tl-tools button, .note-form button { font-size: 12px; padding: 4px 10px; }
  .tl { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; display: grid; grid-template-columns: 58px 1fr auto; gap: 8px; align-items: start; }
  .tl .t { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .tl .kind { font-size: 10.5px; font-weight: 800; margin-right: 6px; }
  .tl .kind.k-question { color: var(--brand); } .tl .kind.k-answer { color: var(--ok); } .tl .kind.k-approval, .tl .kind.k-action { color: var(--bad); }
  .tl .kind.k-note { color: var(--text); } .tl .kind.k-ack, .tl .kind.k-feedback { color: var(--warn); }
  .tl .txt { word-break: break-word; }
  .tl .star { border: 0; background: none; padding: 0 2px; font-size: 15px; line-height: 1; color: var(--muted); }
  .tl .star.on { color: var(--warn); }
  .report-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .report-actions button { flex: 1; font-size: 12.5px; }
  .toast { font-size: 12px; color: var(--ok); min-height: 18px; margin-top: 6px; }

  /* ---- 티니핑 스타일: 파스텔 핑크·보라·민트, 둥근 모서리, 하트·별 장식 ---- */
  body { background-color: var(--bg);
         background-image: var(--bg-characters),
           radial-gradient(circle at 12% 8%, var(--lilac) 0, transparent 38%), radial-gradient(circle at 92% 92%, var(--mint) 0, transparent 40%);          background-size: 660px 523px, auto, auto; background-attachment: fixed, scroll, scroll; }
  header { background: linear-gradient(90deg, var(--header), var(--lilac) 55%, var(--mint)); border-top: 0; border-bottom: 3px dotted var(--brand);
           border-radius: 0 0 28px 28px; box-shadow: 0 6px 18px rgba(255, 95, 168, .18); }
  .brand .mark { background: linear-gradient(90deg, #ff5fa8, #b78cff 55%, #3dc9b0); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 22px; }
  .brand .mark::before { content: "💖 "; -webkit-text-fill-color: initial; }
  .brand .mark::after { content: " ✨"; -webkit-text-fill-color: initial; }
  button { border-width: 2px; border-radius: 999px; padding: 7px 16px; }
  button:hover:not(:disabled) { transform: translateY(-1px) scale(1.03); box-shadow: 0 4px 10px rgba(255, 95, 168, .25); }
  button.primary { background: linear-gradient(135deg, #ff7fbd, #b78cff); border-color: transparent; box-shadow: 0 3px 0 rgba(183, 140, 255, .55); }
  button.primary:hover:not(:disabled) { background: linear-gradient(135deg, #ff5fa8, #9d6dff); border-color: transparent; }
  button.primary::before { content: "💗 "; }
  button.danger:hover:not(:disabled), .approval button.armed { background: var(--bad); }
  .msg.user { border-radius: 22px 22px 6px 22px; background: linear-gradient(135deg, #c9a8ff, #ff9fd0); box-shadow: 0 3px 10px rgba(183, 140, 255, .3); }
  .msg.bot { border: 2px solid var(--line); border-left-width: 2px; border-radius: 22px 22px 22px 6px; box-shadow: 0 4px 14px rgba(255, 95, 168, .12); position: relative; }
  .msg.bot::before { content: "🌸"; position: absolute; top: -12px; left: 14px; font-size: 18px; background: var(--panel); border-radius: 999px; padding: 0 4px; }
  .msg.bot.error { border-color: var(--bad); }
  .answer li::marker { color: var(--brand); content: "💗 "; }
  .badge, .tag, .oc { border-radius: 999px; }
  .welcome { background: linear-gradient(135deg, var(--panel), var(--lilac)); border: 2px dashed var(--brand); border-radius: 28px; padding: 18px 22px; }
  .welcome .eyebrow { color: var(--brand-dark); letter-spacing: .08em; }
  .welcome .eyebrow::before { content: "⭐ "; } .welcome .eyebrow::after { content: " ⭐"; }
  .welcome h2 { background: linear-gradient(90deg, #ff5fa8, #9d6dff 60%, #1fb89a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .welcome h2, .welcome p { word-break: keep-all; overflow-wrap: break-word; }
  .welcome h2::after { content: " 💖"; -webkit-text-fill-color: initial; }
  .examples button { background: var(--panel); border-color: var(--lilac); color: var(--text); }
  .examples button:nth-child(3n+1) { background: var(--lilac); } .examples button:nth-child(3n+2) { background: var(--mint); } .examples button:nth-child(3n) { background: var(--sky); }
  #form { background: linear-gradient(0deg, var(--lilac), var(--panel)); border-top: 3px dotted var(--brand); }
  textarea { border: 2px solid var(--line); border-radius: 20px; background: var(--panel); }
  textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 22%, transparent); }
  aside { background: linear-gradient(180deg, var(--panel), var(--bg)); border-left: 3px dotted var(--brand); }
  aside h3 { border-bottom: 3px dotted var(--brand); color: var(--brand-dark); }
  aside h3::before { content: "🎀 "; }
  .impact { background: linear-gradient(90deg, var(--sky), var(--mint)); border-bottom: 2px dotted var(--brand); color: var(--text); }
  .impact .lead::before { content: "🌈 "; }
  .progress { border: 2px dashed var(--brand); border-radius: 22px; background: var(--panel); }
  .chip { background: var(--lilac); border-color: transparent; }
  .approval { border-radius: 22px; background: color-mix(in srgb, var(--sun) 45%, var(--panel)); border: 2px dashed var(--warn); }
  .approval .title::before { content: "🐰 "; }
  .tabs button[aria-selected="true"] { color: var(--brand-dark); border-bottom: 3px solid var(--brand); }
  .svc.unhealthy, .svc.degraded { border-radius: 12px; }
  .loading::before, .progress li.now::before { border-top-color: var(--brand); }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--brand); border-radius: 999px; border: 2px solid var(--bg); }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .brand .mark { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .brand .mark { animation: none; } button:hover:not(:disabled) { transform: none; } }

<body>

<script>
const EXAMPLES = [
  "payment-api가 CrashLoopBackOff야",
  "order-worker가 OOM으로 계속 죽어. 런북대로 재시작해줘",
  "api-gateway에서 502가 간헐적으로 나",
  "지금 전체 서비스 상태 알려줘",
];
const STATUS_LABEL = { completed: "완료", awaiting_approval: "승인 대기" };
const $ = (id) => document.getElementById(id);
let threadId = null;
let busy = false;
let waitingApproval = false;

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// 답변용 간단 마크다운: 먼저 HTML을 이스케이프한 뒤 제목·목록·굵게·코드·구분선만 바꾼다.
function inline(s) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(src) {
  const lines = esc(src).split(/\r?\n/);
  let html = "", list = null, code = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const line of lines) {
    if (code !== null) {
      if (/^```/.test(line)) { html += `<pre><code>${code}</code></pre>`; code = null; }
      else code += line + "\n";
      continue;
    }
    if (/^```/.test(line)) { close(); code = ""; continue; }
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { close(); html += `<h3>${inline(m[2])}</h3>`; }
    else if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { close(); html += "<hr>"; }
    else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
    else if (!line.trim()) { close(); }
    else { close(); html += `<p>${inline(line)}</p>`; }
  }
  if (code !== null) html += `<pre><code>${code}</code></pre>`;
  close();
  return html;
}

function scrollDown() { const m = $("messages"); m.scrollTop = m.scrollHeight; }
function addEl(cls, html) {
  $("welcome")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.innerHTML = html;
  $("messages").appendChild(el);
  scrollDown();
  return el;
}

function setThread(id) {
  threadId = id;
  $("threadLabel").textContent = id ? "thread " + id.slice(0, 8) : "새 대화";
  $("threadLabel").title = id || "";
}

function setBusy(b) {
  busy = b;
  $("send").disabled = b || waitingApproval;
  $("question").disabled = b || waitingApproval;
  document.querySelectorAll(".examples button").forEach((x) => (x.disabled = b || waitingApproval));
  $("hint").textContent = waitingApproval ? "승인 대기 중인 조치가 있습니다. 위의 승인 또는 거절을 먼저 선택하세요." : "";
}

// ---- 조사 진행 단계 이름: trace의 step을 사람이 읽는 문장으로. null이면 화면에 보이지 않는다(중복·내부 단계). ----
const WORKER_LABEL = { runbook_agent: "런북 담당", ops_agent: "운영 데이터 담당", action_agent: "조치 담당", FINISH: "정리" };
const TOOL_LABEL = { retrieve_runbook: "런북 검색", search_incidents: "과거 장애 이력 조회", get_service_status: "서비스 상태 조회", restart_service: "재시작" };
let services = {};        // 서비스 보드 캐시(승인 카드에 대상의 현재 상태를 보여 줄 때 쓴다)
let actionsCache = [];    // 조치 실행 기록 캐시(변경 목록·보고서용)
const CHANGE_WINDOW_H = 72;  // "최근 변경"으로 강조하는 배포 기간(시간)
// 이 화면의 대응 기록: 질의·답변·승인·확인·메모·평가를 시간순으로 쌓는다(타임라인과 보고서 초안의 재료).
let session = { startedAt: null, events: [], responses: [], newestFirst: true, starOnly: false };

// ---- 조사 결과 분류(Grafana Sift: 발견 / 이상 없음 / 실패) ----
const OUTCOME_LABEL = { found: "발견", clear: "이상 없음", failed: "실패" };
function outcomeOf(t) {
  if (t.step !== "tool_call") return null;
  const tool = t.input && t.input.tool, o = t.output || {};
  if (o.error) return "failed";
  if (tool === "retrieve_runbook") return (o.doc_ids || []).length ? "found" : "clear";
  if (tool === "search_incidents") return (o.incidents || []).length ? "found" : "clear";
  if (tool === "get_service_status") {
    if (o.found === false) return "failed";
    if (o.service === "all") return Object.values(o.services || {}).some((s) => s.status !== "healthy") ? "found" : "clear";
    return o.status && o.status !== "healthy" ? "found" : "clear";
  }
  return null;   // restart_service는 조사가 아니라 조치라 분류하지 않는다
}

function stepLabel(t) {
  const o = t.output, i = t.input;
  switch (t.step) {
    case "load_history": return ["대화 이력 확인", ""];
    case "guard": return String(o).startsWith("blocked") ? ["입력 안전 검사", "지시 무시·프롬프트 노출 요구라 거부", "alert"] : ["입력 안전 검사", "통과"];
    case "supervisor": return o && o.next ? (o.next === "FINISH" ? ["감독자: 조사 정리", o.reason || ""] : [`감독자: ${WORKER_LABEL[o.next] || o.next}에게 배정`, o.reason || ""]) : null;
    case "query_expansion": return ["검색어 확장", o && o.queries ? `${o.queries.length}개 표현` : ""];
    case "hybrid_search": return ["런북 하이브리드 검색", "BM25 + 벡터"];
    case "rerank": return ["후보 재채점", ""];
    case "tool_call": {
      const tool = i && i.tool, name = TOOL_LABEL[tool] || tool;
      if (tool === "retrieve_runbook") return [name, o && o.doc_ids ? `런북 조각 ${o.doc_ids.length}개` : ""];
      if (tool === "search_incidents") return [name, o && o.incidents ? `${o.incidents.length}건` : ""];
      if (tool === "get_service_status") return [name, (i.args || {}).service === "all" ? "전체 서비스" : `${(i.args || {}).service} · ${o && o.status ? o.status : "찾지 못함"}`];
      if (tool === "restart_service") return [`${name} 실행`, o && o.executed ? "실행함" : "실행하지 않음"];
      return [name, ""];
    }
    case "approval_wait": return [`사람 승인 대기: ${TOOL_LABEL[i.tool] || i.tool}`, (i.args || {}).service || "", "alert"];
    case "final_response": return ["최종 답 작성", ""];
    case "no_evidence": return ["근거 없음", "절차를 만들지 않음", "alert"];
    default: return null;   // agent, mcp_call, tool:<이름>, middleware
  }
}

function progressCard(title) {
  const el = addEl("progress", `<div class="head">${esc(title)}<span class="timer">0초</span></div><ol aria-live="polite"></ol>`);
  el.classList.remove("msg");
  const t0 = Date.now();
  const timer = setInterval(() => { el.querySelector(".timer").textContent = Math.round((Date.now() - t0) / 1000) + "초"; }, 1000);
  const ol = el.querySelector("ol");
  const now = document.createElement("li"); now.className = "now"; now.textContent = "진행 중…"; ol.appendChild(now);
  return {
    add(step) {
      const l = stepLabel(step); if (!l) return;
      const li = document.createElement("li");
      if (l[2]) li.className = l[2];
      const oc = outcomeOf(step);
      li.innerHTML = `${esc(l[0])}${l[1] ? ` <span class="sub">${esc(l[1])}</span>` : ""}${oc ? `<span class="oc ${oc}">${OUTCOME_LABEL[oc]}</span>` : ""}`;
      ol.insertBefore(li, now); scrollDown();
    },
    stop() { clearInterval(timer); el.remove(); return Math.round((Date.now() - t0) / 1000); },
  };
}

// NDJSON 스트림을 읽어 단계마다 onStep을 부르고, 마지막 응답(/query·/approve와 같은 형식)을 돌려준다.
async function streamCall(path, body, onStep) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.detail || `요청 실패 (HTTP ${res.status})`); }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", result = null;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let n;
    while ((n = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, n).trim(); buf = buf.slice(n + 1);
      if (!line) continue;
      const ev = JSON.parse(line);
      if (ev.type === "start" && ev.thread_id) setThread(ev.thread_id);
      else if (ev.type === "step") onStep(ev.step);
      else if (ev.type === "result") result = ev.response;
      else if (ev.type === "error") throw new Error(ev.message);
    }
  }
  if (!result) throw new Error("응답이 중간에 끊겼습니다. 다시 시도해 주세요.");
  return result;
}

function pendingActions(trace) {
  const waits = [];
  for (const t of trace || []) if (t.step === "approval_wait") waits.push(t.input || {});
  return waits;
}

// 근거 doc_id → 칩(종류, 이름)
function chipOf(id) {
  let m;
  if ((m = id.match(/^runbooks\/(rb-\d+)[^#]*#chunk-(\d+)$/i))) return ["runbook", "런북", `${m[1].toUpperCase()} · ${Number(m[2]) + 1}`];
  if ((m = id.match(/^incidents\/(.+)$/))) return ["incident", "이력", m[1]];
  if ((m = id.match(/^status\/(.+)$/))) return ["status", "상태", m[1] === "all" ? "전체 서비스" : m[1]];
  if ((m = id.match(/^actions\/([^/]+)\/(.+)$/))) return ["action", "조치", `${m[2]} ${TOOL_LABEL[m[1]] || m[1]}`];
  return ["runbook", "근거", id];
}

function svcLine(s) {
  return `${esc(s.status)} · 파드 ${esc(s.pods_ready)} · 재시작 ${esc(s.restarts_last_hour)}회/시간 · 에러율 ${esc(s.error_rate_pct)}% · p95 ${esc(s.p95_latency_ms)}ms`;
}

function renderResponse(r, info = {}) {
  const trace = r.trace || [];
  const steps = trace.map((t) => t.step);
  let kind = r.status, label = STATUS_LABEL[r.status] || r.status;
  if (steps.includes("no_evidence")) { kind = "no_evidence"; label = "근거 없음"; }
  if (trace.some((t) => t.step === "guard" && String(t.output).startsWith("blocked"))) { kind = "blocked"; label = "요청 거부"; }
  const path = trace.filter((t) => t.step === "supervisor" && t.output && t.output.next && t.output.next !== "FINISH")
    .map((t) => WORKER_LABEL[t.output.next] || t.output.next);
  let html = `<div class="meta"><span class="badge ${esc(kind)}">${esc(label)}</span>` +
    (path.length ? `<span class="path">조사 경로 <b>${path.map(esc).join(" → ")}</b></span>` : "") +
    `<span class="sep"></span>${info.elapsed != null ? `<span>${info.elapsed < 1 ? "1초 미만" : info.elapsed + "초"}</span>` : ""}</div>`;
  // 승인 대기 응답의 answer는 API 사용자용 안내(POST /approve …)라, 화면에서는 아래 승인 카드가 대신 안내한다.
  if (r.status !== "awaiting_approval") html += `<div class="answer">${md(r.answer || "")}</div>`;

  if (r.status === "awaiting_approval") {
    const acts = pendingActions(trace);
    const items = acts.length ? acts.map((a) => {
      const svc = (a.args || {}).service ?? "?", s = services[svc];
      return `<li><code>${esc(a.tool)}</code> — 대상 서비스 <strong>${esc(svc)}</strong>` +
        `<div class="target">현재 상태: ${s ? svcLine(s) : "서비스 상태를 찾지 못했습니다"}</div></li>`;
    }).join("") : "<li>승인이 필요한 조치</li>";
    html += `<div class="approval"><div class="title">사람 승인이 필요한 조치</div><ul>${items}</ul>
      <div class="warnline">승인 전에는 아무것도 실행하지 않았습니다. 재시작은 위험 조치라 승인 버튼을 한 번 더 눌러야 실행됩니다.</div>
      <div class="actions"><button class="primary" data-decision="approve">승인하고 실행</button><button class="danger" data-decision="reject">거절</button></div></div>`;
  }

  // 최근 변경(Datadog Change Tracking): 이번 조사에 나온 서비스에 최근 배포가 있으면 먼저 의심하도록 띄운다.
  const changed = involvedServices(r, info.question).map((n) => [n, services[n]]).filter(([, s]) => s && withinHours(s.last_deploy, CHANGE_WINDOW_H));
  if (changed.length) html += `<div class="changed"><span>최근 변경</span>` + changed.map(([n, s]) =>
    `<button type="button" data-chg="${esc(n)}" title="${esc(s.last_deploy)} — 눌러서 배포 영향 확인 질문 쓰기">${esc(n)} · ${esc(relTime(s.last_deploy))} 배포</button>`).join("") + `</div>`;

  // 조사 결과 분류(Grafana Sift): 조회 단계마다 무엇을 찾았는지, 이상이 없었는지, 실패했는지 묶어 보여 준다.
  const judged = trace.map((t) => [t, outcomeOf(t)]).filter((x) => x[1]);
  if (judged.length) {
    const cnt = (k) => judged.filter((x) => x[1] === k).length;
    html += `<details class="findings"><summary>조사 결과 — 발견 ${cnt("found")} · 이상 없음 ${cnt("clear")}${cnt("failed") ? ` · 실패 ${cnt("failed")}` : ""}</summary>` +
      ["found", "clear", "failed"].filter((k) => cnt(k)).map((k) =>
        `<div class="grp"><div class="h"><span class="oc ${k}">${OUTCOME_LABEL[k]}</span></div><ul>` +
        judged.filter((x) => x[1] === k).map(([t]) => { const l = stepLabel(t) || [t.step, ""]; return `<li>${esc(l[0])}${l[1] ? ` — ${esc(l[1])}` : ""}</li>`; }).join("") +
        `</ul></div>`).join("") + `</details>`;
  }

  const ctx = r.contexts || [];
  if (ctx.length) {
    html += `<div class="chips">` + ctx.map((c, i) => {
      const [cls, k, name] = chipOf(c.doc_id);
      return `<button type="button" class="chip ${cls}" data-ctx="${i}" title="${esc(c.doc_id)}"><span class="k">${k}</span>${esc(name)}</button>`;
    }).join("") + `</div>`;
  }
  html += `<details class="ctxs"><summary>근거 원문 ${ctx.length}건</summary>` +
    (ctx.length ? ctx.map((c, i) => `<div class="ctx" data-i="${i}"><div class="id">${esc(c.doc_id)}</div><pre>${esc(c.text)}</pre></div>`).join("")
                : `<div class="empty">인용한 근거가 없습니다.</div>`) + `</details>`;
  html += `<details><summary>처리 과정 ${trace.length}단계</summary>` +
    trace.map((t, i) => `<div class="step"><span class="n">${i + 1}</span><details><summary>${esc(t.step)}</summary>
      <pre>${esc(JSON.stringify({ input: t.input, output: t.output }, null, 2))}</pre></details></div>`).join("") + `</details>`;
  // 답변 평가(Rootly·Datadog Bits AI·AWS DevOps Agent): 결론이 맞았는지, 틀렸다면 실제 원인을 남긴다.
  if (r.status !== "awaiting_approval" && kind !== "blocked") html += `<div class="fb"></div>`;

  const el = addEl("bot", html);
  decorate(el);
  el.querySelectorAll("[data-chg]").forEach((b) => b.addEventListener("click", () =>
    draft(`${b.dataset.chg}의 최근 배포(${relTime(services[b.dataset.chg]?.last_deploy)})가 이번 증상과 관련 있는지 확인하고, 롤백이 필요한지 런북 기준으로 알려줘`)));
  const fb = el.querySelector(".fb");
  if (fb) wireFeedback(fb, r.thread_id || threadId, info.question || "");
  recordResponse(r, kind, label, info.question);
  el.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => {
    const d = el.querySelector("details.ctxs"); d.open = true;
    const target = d.querySelector(`.ctx[data-i="${b.dataset.ctx}"]`);
    target.scrollIntoView({ behavior: "smooth", block: "center" });
    target.classList.remove("flash"); void target.offsetWidth; target.classList.add("flash");
  }));
  el.querySelectorAll(".approval button").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.decision === "approve" && !b.classList.contains("armed")) {
      // 두 단계 확인: 처음 누르면 무엇이 실행되는지 보여 주고, 5초 안에 한 번 더 눌러야 실행한다.
      const what = pendingActions(trace).map((a) => `${(a.args || {}).service} ${TOOL_LABEL[a.tool] || a.tool}`).join(", ");
      b.classList.add("armed"); b.textContent = `한 번 더 눌러 실행: ${what}`;
      setTimeout(() => { if (!b.disabled) { b.classList.remove("armed"); b.textContent = "승인하고 실행"; } }, 5000);
      return;
    }
    decide(b.dataset.decision, el);
  }));
  if (r.status === "awaiting_approval") el.dataset.pending = pendingText(trace);
  waitingApproval = r.status === "awaiting_approval";
  setBusy(false);
}

function pendingText(trace) {
  return pendingActions(trace).map((a) => `${(a.args || {}).service} ${TOOL_LABEL[a.tool] || a.tool}`).join(", ");
}

// 이번 응답에 등장한 서비스(질문에 쓴 서비스 이름, 도구 인자, 승인 대기 대상, 상태·조치 근거).
function involvedServices(r, question = r.question) {
  const set = new Set();
  const q = String(question || "").toLowerCase();
  for (const n of Object.keys(services)) if (q.includes(n)) set.add(n);
  for (const t of r.trace || []) {
    const svc = ((t.input || {}).args || {}).service;
    if ((t.step === "tool_call" || t.step === "approval_wait") && svc && svc !== "all") set.add(String(svc).toLowerCase());
  }
  for (const c of r.contexts || []) {
    const m = c.doc_id.match(/^status\/(.+)$/) || c.doc_id.match(/^actions\/[^/]+\/(.+)$/);
    if (m && m[1] !== "all") set.add(m[1]);
  }
  return [...set];
}

function plainLine(text) {
  const line = String(text || "").split(/\r?\n/).map((s) => s.replace(/[#*`>]/g, "").replace(/^\s*[-\d.)]+\s*/, "").trim()).find(Boolean) || "";
  return line.length > 140 ? line.slice(0, 140) + "…" : line;
}

function recordResponse(r, kind, label, question) {
  session.responses.push({ ...r, kind, question: question || "", at: Date.now() });
  if (r.status === "awaiting_approval") logEvent("approval", `승인 요청: ${pendingText(r.trace) || "조치"}`);
  else if (kind === "blocked") logEvent("answer", "요청 거부 — 지시 무시·프롬프트 노출 요구");
  else if (kind === "no_evidence") logEvent("answer", "근거 없음 — 런북에 없는 절차라 만들지 않음");
  else logEvent("answer", plainLine(r.answer));
  for (const t of r.trace || [])
    if (t.step === "tool_call" && t.input && t.input.tool === "restart_service" && t.output && t.output.executed)
      logEvent("action", `${t.output.service} 재시작 실행(가짜)`);
}

function wireFeedback(fb, tid, question) {
  const VERDICT = { accurate: "정확함", inaccurate: "부정확함" };
  const initial = () => {
    fb.innerHTML = `<span>결론이 맞았나요?</span><button type="button" data-v="accurate">정확함</button><button type="button" data-v="inaccurate">부정확함</button>`;
    fb.querySelector('[data-v="accurate"]').addEventListener("click", () => send("accurate", ""));
    fb.querySelector('[data-v="inaccurate"]').addEventListener("click", detail);
  };
  const detail = () => {
    fb.innerHTML = `<span>무엇이 틀렸나요? 실제 원인이나 빠진 점을 남기면 다음 대응에 참고합니다.</span>
      <textarea maxlength="1000" placeholder="예: 실제 원인은 배포한 ConfigMap의 DB 주소 오타였음"></textarea>
      <button type="button" class="primary" data-send>평가 보내기</button><button type="button" data-cancel>취소</button>`;
    fb.querySelector("textarea").focus();
    fb.querySelector("[data-send]").addEventListener("click", () => send("inaccurate", fb.querySelector("textarea").value.trim()));
    fb.querySelector("[data-cancel]").addEventListener("click", initial);
  };
  const send = async (verdict, note) => {
    fb.querySelectorAll("button, textarea").forEach((x) => (x.disabled = true));
    try {
      const res = await fetch("/feedback", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ thread_id: tid || "unknown", verdict, note, question: question.slice(0, 1000) }) });
      if (!res.ok) throw new Error();
      fb.innerHTML = `<span class="done">평가를 기록했습니다: ${VERDICT[verdict]}</span>${note ? `<span>— ${esc(note)}</span>` : ""}`;
      logEvent("feedback", `${VERDICT[verdict]}${note ? ` — ${note}` : ""}`);
    } catch {
      fb.querySelectorAll("button, textarea").forEach((x) => (x.disabled = false));
      fb.querySelector(".err")?.remove();
      fb.insertAdjacentHTML("beforeend", `<span class="err" style="color:var(--bad)">저장하지 못했습니다. 다시 눌러 주세요.</span>`);
    }
  };
  initial();
}

// 코드 블록에 복사 버튼을 단다(런북 명령을 바로 옮겨 쓰도록).
function decorate(el) {
  el.querySelectorAll(".answer pre").forEach((pre) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "copy"; b.textContent = "복사";
    b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(pre.querySelector("code")?.textContent ?? pre.textContent); b.textContent = "복사됨"; }
      catch { b.textContent = "복사 실패"; }
      setTimeout(() => (b.textContent = "복사"), 1500);
    });
    pre.appendChild(b);
  });
}

let lastQuestion = "";
async function ask(question) {
  if (busy || waitingApproval || !question.trim()) return;
  addEl("user", esc(question));
  $("question").value = "";
  lastQuestion = question;
  logEvent("question", question);
  setBusy(true);
  const p = progressCard("조사 중");
  try {
    const r = await streamCall("/query/stream", threadId ? { question, thread_id: threadId } : { question }, (s) => p.add(s));
    const elapsed = p.stop();
    setThread(r.thread_id);
    renderResponse(r, { elapsed, question });
  } catch (e) {
    p.stop();
    addEl("bot error", "오류: " + esc(e.message));
    setBusy(false);
  }
  loadModels();
}

async function decide(decision, card) {
  card.querySelectorAll(".approval button").forEach((b) => (b.disabled = true));
  setBusy(true);
  const p = progressCard(decision === "approve" ? "승인한 조치를 실행하는 중" : "거절을 반영하는 중");
  try {
    const r = await streamCall("/approve/stream", { thread_id: threadId, decision }, (s) => p.add(s));
    const elapsed = p.stop();
    card.querySelector(".approval .title").textContent = decision === "approve" ? "승인함" : "거절함";
    card.querySelector(".approval .warnline")?.remove();
    card.querySelector(".approval .actions").innerHTML =
      `<span class="st ${decision === "approve" ? "healthy" : "degraded"}">${decision === "approve" ? "승인해 실행을 요청함" : "거절함 — 실행하지 않음"}</span>`;
    logEvent("approval", `${decision === "approve" ? "승인" : "거절"}: ${card.dataset.pending || "조치"}`);
    renderResponse(r, { elapsed, question: lastQuestion });
    loadActions(); loadServices();
  } catch (e) {
    p.stop();
    addEl("bot error", "오류: " + esc(e.message));
    card.querySelectorAll(".approval button").forEach((b) => { b.disabled = false; b.classList.remove("armed"); });
    card.querySelector('.approval button[data-decision="approve"]').textContent = "승인하고 실행";
    setBusy(false);
  }
  loadModels();
}

const SEVERITY = { unhealthy: 0, degraded: 1, healthy: 2 };
function hoursSince(iso) { const t = Date.parse(iso); return Number.isNaN(t) ? null : (Date.now() - t) / 3600000; }

function withinHours(iso, h) { const x = hoursSince(iso); return x != null && x >= 0 && x < h; }
function relTime(iso) {
  const h = hoursSince(iso);
  if (h == null) return String(iso || "");
  if (h < 0) return "방금";
  if (h < 1) return `${Math.max(1, Math.round(h * 60))}분 전`;
  if (h < 48) return `${Math.round(h)}시간 전`;
  return `${Math.round(h / 24)}일 전`;
}
function hhmm(t, sec = false) {
  return new Date(t).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: sec ? "2-digit" : undefined, hour12: false });
}

// ---- 확인(Opsgenie Acknowledge): 누군가 이 경보를 보고 있다는 표시. 상태가 바뀌면 확인이 풀린다. 이 브라우저에만 저장한다. ----
const ACK_KEY = "runbook-ai.acks";
let acks = {};
try { acks = JSON.parse(localStorage.getItem(ACK_KEY) || "{}") || {}; } catch { acks = {}; }
function saveAcks() { try { localStorage.setItem(ACK_KEY, JSON.stringify(acks)); } catch { /* 저장소를 못 쓰면 이 화면에서만 유지 */ } }
function ackOf(n) { const a = acks[n], s = services[n]; return a && s && a.status === s.status && s.status !== "healthy" ? a : null; }
function toggleAck(n) {
  if (ackOf(n)) { delete acks[n]; logEvent("ack", `${n} 확인 취소`); }
  else { acks[n] = { at: Date.now(), status: services[n].status }; logEvent("ack", `${n} 경보 확인(${services[n].status})`); }
  saveAcks(); renderServices(); renderImpact();
}
// 미확인 문제 → 확인한 문제 → 정상 순, 같은 무리 안에서는 심각한 순.
function sortedServices() {
  const rank = (n) => (services[n].status === "healthy" ? 2 : ackOf(n) ? 1 : 0);
  return Object.keys(services).sort((a, b) => rank(a) - rank(b) || (SEVERITY[services[a].status] ?? 3) - (SEVERITY[services[b].status] ?? 3) || a.localeCompare(b));
}

async function loadServices() {
  try {
    services = await (await fetch("/services")).json();
    renderServices(); renderChanges(); renderImpact();
  } catch { $("services").innerHTML = `<div class="empty">상태를 불러오지 못했습니다.</div>`; }
}

function renderServices() {
  const names = sortedServices();
  const count = (st) => names.filter((n) => services[n].status === st).length;
  const unacked = names.filter((n) => services[n].status !== "healthy" && !ackOf(n)).length;
  $("svcSummary").innerHTML = `<span class="st unhealthy">비정상 <b>${count("unhealthy")}</b></span>` +
    `<span class="st degraded">저하 <b>${count("degraded")}</b></span><span class="st healthy">정상 <b>${count("healthy")}</b></span>` +
    (unacked ? `<span>미확인 <b>${unacked}</b></span>` : "");
  $("services").innerHTML = names.length ? names.map((n) => {
    const s = services[n], a = ackOf(n), h = hoursSince(s.last_deploy);
    const recent = withinHours(s.last_deploy, CHANGE_WINDOW_H) ? `<span class="tag" title="${esc(s.last_deploy)}">${Math.max(1, Math.round(h))}시간 전 배포</span>` : "";
    const ack = s.status === "healthy" ? "" : a
      ? `<span class="acked-tag" title="${esc(hhmm(a.at))}에 확인">확인함</span><button type="button" class="ack" data-ack="${esc(n)}" title="확인 취소">취소</button>`
      : `<button type="button" class="ack" data-ack="${esc(n)}" title="이 경보를 보고 있다고 표시(이 브라우저에 저장)">확인</button>`;
    return `<div class="svc ${esc(s.status)}${a ? " acked" : ""}" data-svc="${esc(n)}" title="눌러서 이 서비스 조사 질문 쓰기"><div class="row"><span class="name"><span class="nm">${esc(n)}</span>${recent}</span><span class="right"><span class="st ${esc(s.status)}">${esc(s.status)}</span>${ack}</span></div>
      <div class="detail">파드 ${esc(s.pods_ready)} · 재시작 ${esc(s.restarts_last_hour)}회/시간 · 에러율 ${esc(s.error_rate_pct)}% · p95 ${esc(s.p95_latency_ms)}ms</div>
      ${s.note ? `<div class="detail">${esc(s.note)}</div>` : ""}</div>`;
  }).join("") : `<div class="empty">서비스가 없습니다.</div>`;
  $("services").querySelectorAll(".svc").forEach((d) => d.addEventListener("click", () => askAbout(d.dataset.svc)));
  $("services").querySelectorAll("[data-ack]").forEach((b) => b.addEventListener("click", (e) => { e.stopPropagation(); toggleAck(b.dataset.ack); }));
}

function askAbout(n) {
  const s = services[n];
  draft(`${n}${s && s.note ? ` (${s.note})` : ""} 현재 상태와 과거 비슷한 장애를 확인하고 대응 절차를 알려줘`);
}

// ---- 영향 요약(Dynatrace Problem overview·Datadog Impacts): 영향 서비스, 가장 심각한 곳, 최근 변경, 대응 경과 ----
function renderImpact() {
  const names = sortedServices();
  if (!names.length) return;
  const bad = names.filter((n) => services[n].status !== "healthy");
  const changes = names.filter((n) => withinHours(services[n].last_deploy, CHANGE_WINDOW_H));
  const worst = bad.slice().sort((a, b) => SEVERITY[services[a].status] - SEVERITY[services[b].status])[0];
  const started = session.startedAt;
  $("impact").innerHTML = `<span class="lead">Impact</span>` +
    `<span>영향 서비스 <b>${bad.length}</b>/${names.length}${worst ? ` · 가장 심각 <b>${esc(worst)}</b>(${esc(services[worst].status)})` : ""}</span>` +
    (bad.length ? `<span class="svcs">${bad.map((n) => `<button type="button" class="${esc(services[n].status)}${ackOf(n) ? " acked" : ""}" data-svc="${esc(n)}" title="${esc(services[n].note || services[n].status)}${ackOf(n) ? " · 확인함" : ""} — 눌러서 조사 질문 쓰기">${esc(n)}</button>`).join("")}</span>` : "") +
    `<span>최근 ${CHANGE_WINDOW_H}시간 배포 <b>${changes.length}</b>${changes.length ? ` (${changes.map(esc).join(", ")})` : ""}</span>` +
    `<span class="clock">${started ? `대응 시작 <b>${esc(hhmm(started))}</b> · 경과 <b>${Math.max(0, Math.floor((Date.now() - started) / 60000))}분</b>` : "대응 시작 전"}</span>`;
  $("impact").querySelectorAll("[data-svc]").forEach((b) => b.addEventListener("click", () => askAbout(b.dataset.svc)));
}

// ---- 변경 목록(Datadog Change Tracking): 배포와 사람이 승인한 조치를 한 줄로 시간순 ----
function renderChanges() {
  const items = [];
  for (const [n, s] of Object.entries(services))
    if (withinHours(s.last_deploy, 24 * 7)) items.push({ t: Date.parse(s.last_deploy), kind: "deploy", k: "배포", what: n, iso: s.last_deploy });
  for (const a of actionsCache) {
    const t = Date.parse(String(a.executed_at || "").replace(/([+-]\d{2})(\d{2})$/, "$1:$2"));
    items.push({ t: Number.isNaN(t) ? 0 : t, kind: "action", k: "조치", what: `${a.target} ${TOOL_LABEL[a.action] || a.action}`, iso: a.executed_at || "" });
  }
  items.sort((a, b) => b.t - a.t);
  $("changes").innerHTML = items.length ? items.slice(0, 10).map((x) =>
    `<div class="chg"><span class="k ${x.kind}">${x.k}</span><span class="what">${esc(x.what)}</span><span class="when" title="${esc(x.iso)}">${x.t ? esc(relTime(new Date(x.t).toISOString())) : esc(x.iso)}</span></div>`).join("")
    : `<div class="empty">최근 7일 안의 배포·조치가 없습니다.</div>`;
}

async function loadIncidents() {
  try {
    const { incidents } = await (await fetch("/incidents?limit=6")).json();
    $("incidents").innerHTML = incidents.length ? incidents.map((x, i) =>
      `<div class="inc"><details><summary><span class="sev ${esc(x.severity)}">${esc(x.severity)}</span><strong>${esc(x.id)}</strong> ${esc(x.service)} · ${esc(x.symptom)}</summary>
        <div class="body">${esc(x.occurred_at)} · 원인: ${esc(x.root_cause)}<br>조치: ${esc(x.resolution)}
        <br><button type="button" data-i="${i}">비슷한지 물어보기</button></div></details></div>`).join("")
      : `<div class="empty">장애 이력이 없습니다.</div>`;
    $("incidents").querySelectorAll("button[data-i]").forEach((b) => b.addEventListener("click", () => {
      const x = incidents[Number(b.dataset.i)];
      draft(`${x.service}에서 "${x.symptom}" 증상이 다시 났어. ${x.id}와 같은 원인인지 확인하고 대응 절차를 알려줘`);
    }));
  } catch { $("incidents").innerHTML = `<div class="empty">이력을 불러오지 못했습니다.</div>`; }
}

async function loadModels() {
  try {
    const m = await (await fetch("/models")).json();
    const main = m.main || {}, [model, region] = String(main.current || "").split("@");
    const short = model.replace(/^(us|global)\.(anthropic|amazon)\./, "").replace(/-\d{8}-v\d+:\d+$/, "").replace(/-v\d+:\d+$/, "");
    const switched = (main.events || []).some((e) => String(e.event).startsWith("daily_quota") || e.event === "probe:daily_quota");
    const label = $("modelLabel");
    label.textContent = `${short} · ${region || ""}${switched ? " · 한도로 대체됨" : ""}`;
    label.classList.toggle("switched", switched);
    label.title = `답변: ${main.current}\n경로 선택: ${(m.router || {}).current}` +
      (switched ? `\n일일 한도에 걸려 설정 모델(${main.configured})에서 대체했습니다.` : "");
  } catch { $("modelLabel").textContent = "모델 상태 알 수 없음"; }
}

async function loadActions() {
  try {
    actionsCache = (await (await fetch("/actions")).json()).actions || [];
    renderChanges();
  } catch { $("changes").innerHTML = `<div class="empty">기록을 불러오지 못했습니다.</div>`; }
}

// ---- 세션 타임라인·메모(Datadog timeline·CloudWatch investigation feed), 별표(FireHydrant) ----
const KIND_LABEL = { question: "질의", answer: "답변", approval: "승인", action: "조치", ack: "확인", note: "메모", feedback: "평가" };
function logEvent(kind, text) {
  if (!session.startedAt) session.startedAt = Date.now();
  session.events.push({ at: Date.now(), kind, text: String(text), star: kind === "action" || kind === "approval" });
  renderTimeline(); renderImpact();
}

function renderTimeline() {
  const ev = session.events;
  $("tlCount").textContent = ev.length ? ` ${ev.length}` : "";
  $("tlInfo").textContent = ev.length ? `${ev.length}건 · 별표 ${ev.filter((e) => e.star).length}건` : "아직 기록이 없습니다";
  $("tlOrder").textContent = session.newestFirst ? "최신순" : "오래된순";
  $("tlStarOnly").setAttribute("aria-pressed", String(session.starOnly));
  $("tlStarOnly").classList.toggle("ghost", session.starOnly);
  let list = ev.map((e, i) => ({ ...e, i })).filter((e) => !session.starOnly || e.star);
  if (session.newestFirst) list = list.reverse();
  $("timeline").innerHTML = list.length ? list.map((e) =>
    `<div class="tl"><span class="t">${esc(hhmm(e.at, true))}</span><span class="txt"><span class="kind k-${e.kind}">${KIND_LABEL[e.kind] || e.kind}</span>${esc(e.text)}</span>` +
    `<button type="button" class="star${e.star ? " on" : ""}" data-i="${e.i}" aria-label="별표" title="별표한 기록은 보고서의 주요 기록에 들어갑니다">${e.star ? "★" : "☆"}</button></div>`).join("")
    : `<div class="empty">${session.starOnly ? "별표한 기록이 없습니다." : "질의·승인·메모가 여기에 시간순으로 쌓입니다."}</div>`;
  $("timeline").querySelectorAll(".star").forEach((b) => b.addEventListener("click", () => {
    const e = session.events[Number(b.dataset.i)]; e.star = !e.star; renderTimeline();
  }));
}

// ---- 보고서 초안(CloudWatch incident report·FireHydrant retrospective 구성): 화면 기록만으로 Markdown을 만든다 ----
function buildReport() {
  const fmt = (t) => new Date(t).toLocaleString("ko-KR", { hour12: false });
  const ev = session.events, R = session.responses;
  const now = Date.now(), start = session.startedAt;
  const bad = sortedServices().filter((n) => services[n].status !== "healthy");
  const involved = [...new Set(R.flatMap((r) => involvedServices(r)))];
  const lastDone = R.filter((r) => r.status === "completed" && r.kind === "completed").at(-1);
  const ctxIds = [...new Set(R.flatMap((r) => (r.contexts || []).map((c) => c.doc_id)))];
  const myActions = actionsCache.filter((a) => a.thread_id && a.thread_id === threadId);
  const L = [];
  L.push("# 장애 대응 보고서 초안", "",
    `- 작성: ${fmt(now)} · 런북 대응 어시스턴트(모든 데이터와 조치는 가짜)`,
    `- 대화: ${threadId || "-"}`,
    `- 대응 시작: ${start ? fmt(start) : "-"} · 경과 ${start ? Math.floor((now - start) / 60000) : 0}분`, "");
  L.push("## 1. 개요", "");
  const qs = ev.filter((e) => e.kind === "question");
  L.push(qs.length ? `- 첫 보고: ${qs[0].text}` : "- 질의 없음", `- 질의 ${qs.length}건, 답변 ${R.length}건`, "");
  L.push("## 2. 영향", "");
  if (bad.length) bad.forEach((n) => L.push(`- ${n}: ${services[n].status} · 파드 ${services[n].pods_ready} · 에러율 ${services[n].error_rate_pct}% · p95 ${services[n].p95_latency_ms}ms${services[n].note ? ` · ${services[n].note}` : ""}${ackOf(n) ? " · 확인함" : ""}`));
  else L.push("- 지금 비정상·저하 서비스 없음");
  if (involved.length) L.push(`- 이번 조사에서 본 서비스: ${involved.join(", ")}`);
  const recent = Object.keys(services).filter((n) => withinHours(services[n].last_deploy, CHANGE_WINDOW_H));
  L.push(`- 최근 ${CHANGE_WINDOW_H}시간 배포: ${recent.length ? recent.map((n) => `${n}(${relTime(services[n].last_deploy)})`).join(", ") : "없음"}`, "");
  L.push("## 3. 대응 경과", "");
  ev.length ? ev.forEach((e) => L.push(`- ${hhmm(e.at, true)} [${KIND_LABEL[e.kind] || e.kind}]${e.star ? " ★" : ""} ${e.text}`)) : L.push("- 기록 없음");
  L.push("");
  L.push("## 4. 원인 분석과 대응 절차", "", lastDone ? lastDone.answer.trim() : "(근거가 있는 완료 답변이 아직 없습니다)", "");
  L.push("## 5. 실행한 조치", "");
  const decisions = ev.filter((e) => e.kind === "approval" || e.kind === "action");
  decisions.length ? decisions.forEach((e) => L.push(`- ${hhmm(e.at, true)} ${e.text}`)) : L.push("- 승인·실행한 조치 없음");
  myActions.forEach((a) => L.push(`- 실행 로그: ${a.action} → ${a.target} (${a.executed_at})`));
  L.push("");
  L.push("## 6. 근거", "");
  ctxIds.length ? ctxIds.forEach((id) => L.push(`- \`${id}\``)) : L.push("- 인용한 근거 없음");
  L.push("");
  const stars = ev.filter((e) => e.star && e.kind !== "action" && e.kind !== "approval");
  L.push("## 7. 주요 기록과 다음 단계", "");
  const notes = ev.filter((e) => e.kind === "note");
  if (stars.length) stars.forEach((e) => L.push(`- ★ ${e.text}`));
  notes.filter((e) => !e.star).forEach((e) => L.push(`- 메모: ${e.text}`));
  if (!stars.length && !notes.length) L.push("- (메모를 남기면 여기에 들어갑니다)");
  L.push("");
  const fbs = ev.filter((e) => e.kind === "feedback");
  L.push("## 8. 어시스턴트 답변 평가", "");
  fbs.length ? fbs.forEach((e) => L.push(`- ${e.text}`)) : L.push("- 평가 없음");
  return L.join("\n") + "\n";
}

function toast(msg) { $("reportToast").textContent = msg; setTimeout(() => ($("reportToast").textContent = ""), 2500); }

function showTab(which) {
  const board = which === "board";
  $("tabBoard").hidden = !board; $("tabTimeline").hidden = board;
  $("tabBoardBtn").setAttribute("aria-selected", String(board));
  $("tabTimelineBtn").setAttribute("aria-selected", String(!board));
}

function draft(text) {
  if (busy || waitingApproval) return;
  $("question").value = text;
  $("question").focus();
}

EXAMPLES.forEach((q) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = q;
  b.addEventListener("click", () => ask(q));
  $("examples").appendChild(b);
});
$("form").addEventListener("submit", (e) => { e.preventDefault(); ask($("question").value); });
$("question").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask($("question").value); }
});
$("newChat").addEventListener("click", () => {
  if (busy) return;
  if (session.events.length && !confirm("새 대화를 시작하면 이 화면의 타임라인·메모가 지워집니다. 필요하면 먼저 보고서를 복사하세요. 계속할까요?")) return;
  setThread(null); waitingApproval = false; lastQuestion = "";
  session = { startedAt: null, events: [], responses: [], newestFirst: session.newestFirst, starOnly: false };
  $("messages").innerHTML = "";
  renderTimeline(); renderImpact();
  setBusy(false);
  $("question").focus();
});
$("refreshSvc").addEventListener("click", loadServices);
$("refreshLog").addEventListener("click", () => { loadActions(); loadServices(); });
$("tabBoardBtn").addEventListener("click", () => showTab("board"));

// 상황판 섹션 접기/펼치기: 제목 줄이나 ▾ 버튼을 누르면 토글하고, 상태는 이 브라우저에 저장한다.
const FOLD_KEY = "runbook.folds.v1";
let folds = {};
try { folds = JSON.parse(localStorage.getItem(FOLD_KEY) || "{}") || {}; } catch { folds = {}; }
function saveFolds() { try { localStorage.setItem(FOLD_KEY, JSON.stringify(folds)); } catch { /* 저장소를 못 쓰면 이 화면에서만 유지 */ } }
document.querySelectorAll("#tabBoard section[data-fold]").forEach((sec) => {
  const key = sec.dataset.fold, btn = sec.querySelector("button.fold"), body = sec.querySelector(".fold-body");
  const apply = (collapsed) => {
    body.hidden = collapsed;
    sec.classList.toggle("collapsed", collapsed);
    btn.setAttribute("aria-expanded", String(!collapsed));
  };
  apply(!!folds[key]);
  const toggle = () => { folds[key] = !folds[key]; apply(folds[key]); saveFolds(); };
  btn.addEventListener("click", (e) => { e.stopPropagation(); toggle(); });
  sec.querySelector("h3 .ttl").addEventListener("click", (e) => { if (e.target !== btn) toggle(); });
});

$("tabTimelineBtn").addEventListener("click", () => showTab("timeline"));
$("noteForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("noteText").value.trim();
  if (!text) return;
  logEvent("note", text);
  $("noteText").value = "";
});
$("noteText").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !e.isComposing) { e.preventDefault(); $("noteForm").requestSubmit(); }
});
$("tlOrder").addEventListener("click", () => { session.newestFirst = !session.newestFirst; renderTimeline(); });
$("tlStarOnly").addEventListener("click", () => { session.starOnly = !session.starOnly; renderTimeline(); });
$("copyReport").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(buildReport()); toast("보고서 초안을 복사했습니다."); }
  catch { toast("복사하지 못했습니다. .md 내려받기를 쓰세요."); }
});
$("downloadReport").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buildReport()], { type: "text/markdown;charset=utf-8" }));
  const d = new Date(), pad = (x) => String(x).padStart(2, "0");
  a.download = `incident-report-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.md`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("보고서 초안을 내려받았습니다.");
});
// "/" 키로 입력창에 바로 간다(입력 중일 때는 그대로 글자 입력).
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "") && !$("question").disabled) {
    e.preventDefault(); $("question").focus();
  }
});
renderTimeline();
loadServices(); loadActions(); loadIncidents(); loadModels();
setInterval(() => { if (!busy) loadServices(); }, 30000);
setInterval(renderImpact, 20000);   // 대응 경과 시간 갱신
</script>
</body>
</html>
